<!doctype html>
<!-- Lewydo™ brand kit for the web — a working example: the splash, the menu pill, one heartbeat. https://roshevasternin.github.io/brand/ -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lewydo brand — web example</title>
<link rel="stylesheet" href="lewydo-brand.css">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;background:#0E1024;font-family:system-ui,sans-serif;color:#fff;}
  button{font:inherit;font-weight:800;color:#04120A;background:#3DDC84;border:0;border-radius:16px;min-height:52px;padding:0 24px;cursor:pointer;}
</style>
</head>
<body>
  <!-- the Lockup; .lw-splash plays the BrandScreen intro -->
  <span class="lw-lockup lw-splash" id="splash" role="img" aria-label="Lewydo — Love What You Do">
    <span class="lw-logo"><img class="lw-back" src="../../webp/brand_back.webp" alt=""><img class="lw-front" src="../../webp/brand_front.webp" alt=""></span>
    <img class="lw-name" src="../../webp/lewydo.webp" alt="">
    <img class="lw-slogan" src="../../webp/slogan.webp" alt="">
    <img class="lw-line" src="../../webp/brand_line.webp" alt="">
  </span>
  <button type="button" id="again">Play the splash again</button>
  <!-- the Signature pill (bottom of a menu) — it beats once when it appears; tap → your About us -->
  <a class="lw-pill" href="#about" aria-label="About us">
    <span class="lw-sig"><span class="lw-logo" id="pillLogo"><img class="lw-back" src="../../webp/brand_back.webp" alt=""><img class="lw-front" src="../../webp/brand_front.webp" alt=""></span><img class="lw-name" src="../../webp/lewydo.webp" alt=""></span>
    <svg class="lw-go" viewBox="0 0 5 8" aria-hidden="true"><path d="M1 1l3 3-3 3" fill="none" stroke="#9DF5C2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <script>
    // replay: remove the class, force a reflow, add it back (the same way you replay one heartbeat: .lw-beating)
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    document.getElementById('again').onclick = () => replay(document.getElementById('splash'), 'lw-splash');
    setTimeout(() => replay(document.getElementById('pillLogo'), 'lw-beating'), 800);   // the pill appeared → one beat
  </script>
</body>
</html>
