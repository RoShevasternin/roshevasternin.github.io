<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lewydo™ · 404</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1024">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* A lost page anywhere on roshevasternin.github.io lands here (GitHub Pages), so every path is absolute. The mark is the standard. */
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center;color:#fff;font:500 17px/1.6 var(--f,"Nunito",system-ui,sans-serif);
  background:radial-gradient(60% 50% at 50% 0%,rgba(61,220,132,.18),transparent 72%),#0E1024;}
main{max-width:520px;display:flex;flex-direction:column;align-items:center;}
{{brandCss}}
{{langFonts}}
.code{margin-top:26px;font-weight:900;font-size:13px;letter-spacing:.24em;color:#9DF5C2;}
h1{font-weight:900;font-size:clamp(30px,6vw,42px);line-height:1.1;margin-top:8px;}
p{color:rgba(242,255,247,.8);margin-top:12px;}
a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;margin-top:26px;border-radius:16px;background:#3DDC84;color:#04120A;
  font-weight:900;text-decoration:none;box-shadow:0 0 30px rgba(61,220,132,.36);}
</style>
</head>
<body>
<main>
  {{lockup404}}
  <p class="code">404</p>
  <h1 data-t="nf.title"></h1>
  <p data-t="nf.text"></p>
  <a href="/" data-t="nf.home"></a>
</main>
<script id="data" type="application/json">{{DATA404}}</script>
<script>
(() => {
  const { S: D, rtl } = JSON.parse(document.getElementById('data').textContent), ids = Object.keys(D);
  // the same rules as every page of ours (src/lang-boot.js): the visitor's choice → the device (old codes too; no Russian) → English
  const ALIAS = { iw: 'he', in: 'id', tl: 'fil', no: 'nb', nn: 'nb', prs: 'fa' };
  const pick = (tag) => { if (!tag) return null; const p = String(tag).replace(/_/g, '-').toLowerCase().split('-');
    if (p[0] === 'zh') return p.includes('hant') || p.some((x) => x === 'tw' || x === 'hk' || x === 'mo') ? 'zh-TW' : 'zh-CN';
    const b = ALIAS[p[0]] || p[0]; return ids.includes(b) ? b : null; };
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lang = [get('lewydo:lang'), get('cubepix-site:lang')].find((l) => ids.includes(l)) || (navigator.languages || [navigator.language]).map(pick).find(Boolean) || 'en';
  document.documentElement.lang = lang; document.documentElement.dir = rtl.includes(lang) ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = D[lang][el.dataset.t] || D.en[el.dataset.t]; });
  setTimeout(() => document.querySelector('.lw-logo').classList.add('lw-beating'), 200);
})();
</script>
</body>
</html>
