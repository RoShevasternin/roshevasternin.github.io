<!-- The paper plane to the contacts (owner 17.11.2026: «a little plane on every site that scrolls to the section with the contacts»; the same on
     orbitdash.lewydo.com and cubepix.lewydo.com). A round button the size of the music record, right above it (the script moves it into the
     record's column, so it also rises above the song's card when that is open); on a page without the record — in that same corner.
     The main page: a tap glides to #contact (at once with reduced motion), the section's title takes the focus, the address says #contact.
     Every other page (/brand/, /press/, 404): a link to the main page's contacts, /#contact (in the page's language — data-lang-link).
     It fades away while the contacts are on screen (it has nothing to add there) and while a button of the page is under it — a call to
     action, the footer's links, the floating «Collapse the story» — so it never covers one. Its name and tooltip — contact.mail («Write to us»), the page's language.
     The build's «plane:here» — the main page, «plane:home» — the others (tools/build.mjs). -->
<style>
.ct-dock{position:fixed;right:calc(max(16px,env(safe-area-inset-right)) + 2px);bottom:max(16px,env(safe-area-inset-bottom));z-index:45;pointer-events:none;}
.mu ~ .ct-dock{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 68px);}   /* no script: above the record all the same */
/* [17.11.2026] власник: «на студії теж можна краще … літачок хочу ще зрозумілішим і по центру кнопки» — кнопка з ПІДПИСОМ (як на orbitdash.lewydo.com):
   темне скло, зелене неонове кільце, зелений кружок з паперовим літачком (два крила зі щілиною) рівно по центру, підпис «Write to us» мовою сторінки;
   поки гортають — лише кружок (.mini), зупинились — знову з підписом; раз на 7 с — тиха хвиля навколо кружка */
a.ct-plane{position:relative;display:inline-flex;align-items:center;gap:10px;height:50px;min-height:0;max-width:calc(100vw - 32px);margin:0;padding:0 18px 0 6px;border-radius:999px;
  pointer-events:auto;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;white-space:nowrap;text-decoration:none;
  background:linear-gradient(180deg,rgba(24,40,44,.94),rgba(10,14,30,.94));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1.5px rgba(61,220,132,.6),0 12px 30px -10px rgba(0,0,0,.8),0 0 24px -6px rgba(61,220,132,.55);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:opacity .22s ease,transform .22s ease,box-shadow .2s ease,gap .3s ease,padding .3s ease,visibility 0s;}
.ct-dock a.ct-plane{margin:0;}
.ct-plane .cp-ico{position:relative;flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#27b366;background:#27b366;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 14px -3px rgba(61,220,132,.9);}   /* суцільний зелений кружок, білий літачок (щілина — колір кружка) */
.ct-plane .cp-ico svg{width:19px;height:19px;overflow:visible;transform:translate(-1px,1px);transition:transform .3s cubic-bezier(.3,1.6,.5,1);}   /* Bootstrap Icons «send-fill» (MIT) — стандартний літачок «надіслати» */
.ct-plane .cp-ico::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px #3DDC84;opacity:0;animation:cpWave 7s ease-out 2s infinite;}
@keyframes cpWave{0%,86%{opacity:0;transform:scale(1);}88%{opacity:.7;}100%{opacity:0;transform:scale(1.55);}}
.ct-plane .cp-t{overflow:hidden;text-overflow:ellipsis;max-width:60vw;transition:max-width .3s ease,opacity .2s ease;}
a.ct-plane.mini,a.ct-plane.tight{gap:0;padding:0 6px;}
a.ct-plane.mini .cp-t,a.ct-plane.tight .cp-t{max-width:0;opacity:0;}
html[dir="rtl"] .ct-plane .cp-ico svg{transform:scaleX(-1) translate(-1px,1px);}   /* it flies the way the page reads */
@media (hover:hover){a.ct-plane:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1.5px #3DDC84,0 12px 30px -10px rgba(0,0,0,.8),0 0 32px -4px rgba(61,220,132,.75);}
  a.ct-plane:hover .cp-ico svg{transform:translate(1px,-1.5px);} html[dir="rtl"] a.ct-plane:hover .cp-ico svg{transform:scaleX(-1) translate(1px,-1.5px);}}
a.ct-plane:active{transform:scale(.97);}
a.ct-plane:focus-visible{outline:3px solid #fff;outline-offset:3px;}
@media (max-width:359px){a.ct-plane{font-size:13px;gap:8px;padding:0 14px 0 5px;}}
a.ct-plane.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s;}   /* it keeps its place: only fades */
@media (prefers-reduced-motion: reduce){a.ct-plane,a.ct-plane svg,a.ct-plane.off,.ct-plane .cp-t{transition:none;}.ct-plane .cp-ico::after{animation:none;}}
html.og .ct-dock,html.kit .ct-dock,html.og .ct-plane,html.kit .ct-plane{display:none !important;}
@media print{.ct-dock,.ct-plane{display:none !important;}}
</style>
<div class="ct-dock" id="ctDock"><a class="ct-plane" id="ctPlane" {{planeHref}} data-ct="plane" data-ta="aria-label:contact.mail"><span class="cp-ico" aria-hidden="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#fff" d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"/></svg></span><span class="cp-t" data-t="contact.mail"></span></a></div>
<script>
(() => {
  const fab = document.getElementById('ctPlane'), dock = document.getElementById('ctDock'), mu = document.getElementById('mu');
  if (!fab) return;
  if (mu) { mu.prepend(fab); dock.remove(); }                     // in the record's column: right above it, and above its card when it opens
  const sec = document.getElementById('contact'), head = sec && sec.querySelector('h2');
  const RM = matchMedia('(prefers-reduced-motion: reduce)');
  // the tooltip says what its name says — in the page's language (the name changes with it)
  const tip = () => { fab.title = fab.getAttribute('aria-label') || ''; };
  tip(); new MutationObserver(tip).observe(fab, { attributes: true, attributeFilter: ['aria-label'] });
  // away while the contacts are on screen, or while a button of the page (a call to action, the footer's links, «Collapse the story») is under it
  const AVOID = 'main .btn, footer a, footer button, .tl-more.done .tl-allb, [data-plane-avoid]';
  let q = 0;
  const check = () => { q = 0;
    const R = () => fab.getBoundingClientRect(), near = (b, r = R()) => b.width > 0 && b.height > 0 && b.left < r.right + 6 && b.right > r.left - 6 && b.top < r.bottom + 6 && b.bottom > r.top - 6;
    let off = !!sec && (() => { const s = sec.getBoundingClientRect(); return s.top < innerHeight && s.bottom > 0; })();
    // біля кнопки сторінки — спершу лише кружок (.tight, як .mini), ховаємося, лише коли й кружок налазить
    const ico = fab.querySelector('.cp-ico'), hits = (r) => [...document.querySelectorAll(AVOID)].some((el) => near(el.getBoundingClientRect(), r));
    // пігулка (без .tight) і сам кружок — кружок не залежить від анімації ширини
    // повна пігулка з підписом (не поточна ширина посеред анімації): кружок + проміжок + підпис + поля
    const ir = ico.getBoundingClientRect(), lab = fab.querySelector('.cp-t'), wFull = ir.width + 10 + (lab ? lab.scrollWidth : 0) + 24;
    const fr = R();   // колонка платівки (.mu) — ltr і праворуч і в RTL: пігулка завжди росте ліворуч від правого краю
    const pill = { left: fr.right - wFull, right: fr.right, top: fr.top, bottom: fr.bottom };
    const tight = !off && hits(pill);
    fab.classList.toggle('tight', tight);
    if (tight) off = hits(ir);
    fab.classList.toggle('off', off); };
  const kick = () => { if (!q) q = requestAnimationFrame(check); };
  let still = 0;
  addEventListener('scroll', () => { kick(); fab.classList.add('mini'); clearTimeout(still); still = setTimeout(() => fab.classList.remove('mini'), 900); }, { passive: true }); addEventListener('resize', kick);
  if ('ResizeObserver' in window) { const ro = new ResizeObserver(kick); ro.observe(document.body); if (mu) ro.observe(mu); }
  check();
  // the record's first-visit word goes after the plane's tap (src/music.html leaves it up on the plane's pointerdown, so nothing moves under the finger)
  const hush = () => { const h = document.getElementById('muHint'); if (h && !h.hidden) { h.hidden = true; mu.classList.remove('ask'); } };
  fab.addEventListener('click', hush);
  if (!sec) return;                                               // another page: the link itself goes to the main page's contacts
  head.setAttribute('tabindex', '-1');
  const go = (smooth) => sec.scrollIntoView({ behavior: smooth && !RM.matches ? 'smooth' : 'instant', block: 'start' });
  fab.addEventListener('click', (e) => {
    e.preventDefault(); go(true); head.focus({ preventScroll: true });
    const url = location.pathname + location.search + '#contact';
    try { if (location.hash === '#contact') history.replaceState(history.state, '', url); else history.pushState(null, '', url); } catch (_) {}
  });
  // came here by /#contact (the plane on another page): the words, fonts and pictures above still arrive — the contacts are held in sight
  // until the visitor touches, scrolls or types
  if (location.hash === '#contact') {
    let held = true; const free = () => { held = false; };
    for (const t of ['wheel', 'touchstart', 'pointerdown', 'keydown']) addEventListener(t, free, { passive: true, once: true });
    // (the title takes the focus too — again while held: the browser's own jump to the anchor lets it go)
    const hold = () => { if (!held) return; go(false); if (document.activeElement === document.body || !document.activeElement) head.focus({ preventScroll: true }); };
    hold();
    addEventListener('load', hold); setTimeout(hold, 400); setTimeout(() => { hold(); held = false; }, 1600);
  }
})();
</script>
